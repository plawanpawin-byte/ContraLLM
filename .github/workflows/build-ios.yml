name: Build iOS IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ContraLLM/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project
        run: |
          test -d ContraLLM.xcodeproj || (echo "ContraLLM.xcodeproj was not generated" && exit 1)
          xcodebuild -list -project ContraLLM.xcodeproj

      - name: Build (Release, unsigned, iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -project ContraLLM.xcodeproj \
            -scheme ContraLLM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Locate .app bundle
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under build/Build/Products" >&2
            find build -maxdepth 4 -type d >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app bundle at: $APP_PATH"

      - name: Package IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ContraLLM-unsigned.ipa Payload
          mkdir -p dist
          mv ContraLLM-unsigned.ipa dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContraLLM-IPA
          path: dist/ContraLLM-unsigned.ipa
          if-no-files-found: error
