name: ContraLLM
options:
  bundleIdPrefix: com.contra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  ContraLLM:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ContraLLM
    info:
      path: Generated/ContraLLM-Info.plist
      properties:
        CFBundleDisplayName: Contra
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Contra uses the microphone so you can talk with AI about your research and learning materials."
        NSSpeechRecognitionUsageDescription: "Contra uses speech recognition to convert your voice into questions for AI."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: ContraLLM
        PRODUCT_BUNDLE_IDENTIFIER: com.contra.llm
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
